<!DOCTYPE html>
<html>
<head>
    <title>SecurePay Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
     .container { max-width: 400px; width: 90%; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h2 { color: #1e3c72; text-align: center; margin-bottom: 10px; }
     .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #1e3c72; outline: none; }
        button { width: 100%; padding: 15px; background: #1e3c72; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background: #152a52; }
     .error { background: #fee; color: #c33; padding: 10px; border-radius: 5px; text-align: center; margin: 10px 0; border: 1px solid #fcc; }
     .demo-creds { background: #f0f8ff; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 13px; border: 1px solid #b3d9ff; }
     .demo-creds b { color: #1e3c72; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏦 SecurePay</h2>
        <p class="subtitle">AI Powered Payment Gateway</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Email ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login to Dashboard</button>
        </form>

        <div class="demo-creds">
            <b>Demo Credentials:</b><br>
            Email: user@securepay.com<br>
            Password: user123
        </div>
    </div>
</body>
</html>
